limit_req_zone $binary_remote_addr zone=tickets_public:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    client_max_body_size 72m;
    limit_req_status 429;
    error_page 413 = @too_large;
    error_page 429 = @too_many;

    location @too_large {
        default_type application/json;
        return 413 '{"error":"La solicitud excede el tamaño permitido. Máximo 10 MB por archivo y 50 MB en total."}';
    }
    location @too_many {
        default_type application/json;
        return 429 '{"error":"Demasiadas solicitudes. Espera un momento y vuelve a intentar."}';
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/api/tickets(?:/|$) {
        limit_req zone=tickets_public burst=120 nodelay;
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 65s;
    }
    location /api/ {
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 65s;
    }

    location ~* \.(?:css|js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
}
